name: Habitat authentication

on:
  push:
    branches: [main, 'codex/habitat-auth-*']
  pull_request:
    paths: ['habitat/**', '.github/workflows/habitat-test.yml']

permissions:
  contents: read

jobs:
  habitat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: habitat/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: habitat/ui/package-lock.json
      - name: Build the real embedded frontend
        working-directory: habitat/ui
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
      - name: Test, vet, and build Habitat without a database service
        working-directory: habitat
        run: |
          set -euo pipefail
          go version
          test -z "$(gofmt -l internal/config internal/server)"
          go test -race -count=1 -v ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/habitat" ./cmd/habitat
      - name: Prove the authentication contracts reject the pre-fix baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(mktemp -d "$RUNNER_TEMP/habitat-baseline.XXXXXX")"
          git archive 5179ad1df09898082cdb97bf3bb4279e211d08cb habitat | tar -x -C "$baseline"
          cp habitat/internal/config/auth_contract_test.go "$baseline/habitat/internal/config/"
          cp habitat/internal/server/auth_integration_test.go "$baseline/habitat/internal/server/"
          cp -R habitat/internal/web/dist "$baseline/habitat/internal/web/"
          cd "$baseline/habitat"
          if go test -json -count=1 ./internal/config ./internal/server -run '^TestAuth(Contract|Integration)' > "$RUNNER_TEMP/habitat-baseline.json"; then
            cat "$RUNNER_TEMP/habitat-baseline.json"
            echo 'Expected the pre-authentication baseline to fail the new contracts.' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/habitat-baseline.json"
          python3 - "$RUNNER_TEMP/habitat-baseline.json" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          failed = {e.get('Test') for e in events if e.get('Action') == 'fail'}
          required = {
              'TestAuthContractDefaultAndListener',
              'TestAuthIntegrationProtectsRealMux',
              'TestAuthIntegrationCredentialAndAssetRouting',
          }
          assert required <= failed, f'Expected behavioral test failures, got {failed}'
          passed = {e.get('Test') for e in events if e.get('Action') == 'pass'}
          assert 'TestAuthIntegrationLoopbackWithoutCredentials' in passed
          assert 'TestAuthIntegrationHealthAndBasePath' in passed
          print('Baseline compiled and failed all three authentication contracts; compatibility controls passed.')
          PY
      - name: Prove unusable usernames were accepted by the original authentication patch
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(mktemp -d "$RUNNER_TEMP/habitat-auth-baseline.XXXXXX")"
          git archive 0fb15672e25c2be8533b8aef30a07edd7e8f5499 habitat | tar -x -C "$baseline"
          cp habitat/internal/config/auth_contract_test.go "$baseline/habitat/internal/config/"
          cd "$baseline/habitat"
          if go test -json -count=1 ./internal/config -run '^TestAuthContractDefaultAndListener/colon_username$' > "$RUNNER_TEMP/habitat-username-baseline.json"; then
            echo 'Expected original auth source to accept an unusable username.' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/habitat-username-baseline.json"
          python3 - "$RUNNER_TEMP/habitat-username-baseline.json" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          assert any(e.get('Action') == 'fail' and e.get('Test') ==
                     'TestAuthContractDefaultAndListener/colon_username' for e in events)
          print('Original auth patch compiled and failed the unusable-username contract.')
          PY
